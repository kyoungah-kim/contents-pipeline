# Copy to <data root>/themes/<id>.yaml. A theme is a lens over the catalog:
# it says which on-screen facts each beat needs, never which clips to use.
id: example-entryway
title: Small entryway refresh
hook: "Entryway in one afternoon"
end_text: "Save for your next weekend"
caption: "Three changes, no tools. What would you add?"
avoid: {content: [clutter-closeup]}
beats:
  before:
    want: {state: [before], space: [entry]}
    prefer: {shot: [wide, fixed-angle]}
  after:
    want: {state: [after], space: [entry]}
    prefer: {shot: [wide, fixed-angle]}
    pair_with: before      # prefer the same angle as the chosen before shot
  detail:
    want: {state: [after, detail], shot: [closeup]}
  step1: {want: {action: [assembling]}, text: "1. Hooks at kid height"}
  step2: {want: {action: [styling]}, text: "2. One basket per person"}
  step3: {want: {action: [hanging-art]}, text: "3. Art at eye level"}
